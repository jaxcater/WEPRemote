name: Build WEP iOS IPA & Windows Host

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-ipa:
    name: Build Unsigned WEP.ipa (macOS Xcode)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate WEP.xcodeproj
        working-directory: ios/WEP
        run: xcodegen generate

      - name: Build WEP.app (Release, iphoneos, unsigned)
        working-directory: ios/WEP
        run: |
          xcodebuild \
            -project WEP.xcodeproj \
            -scheme WEP \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package WEP.ipa
        working-directory: ios/WEP
        run: |
          mkdir -p ipa_stage/Payload
          cp -R build/Build/Products/Release-iphoneos/WEP.app ipa_stage/Payload/
          cd ipa_stage
          zip -qry ../WEP.ipa Payload
          cd ..
          ls -lh WEP.ipa

      - name: Upload WEP.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WEP-ipa
          path: ios/WEP/WEP.ipa
          retention-days: 90

  build-windows-host:
    name: Build WEP.Host.exe (Windows .NET 9)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish Single-File WEP.Host.exe
        run: dotnet publish windows/WEP.Host/WEP.Host.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/WEP.Host

      - name: Upload WEP.Host Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WEP-Host-win-x64
          path: dist/WEP.Host/WEP.Host.exe
          retention-days: 90

  publish-release:
    name: Publish Latest Release Assets
    needs: [ build-ios-ipa, build-windows-host ]
    runs-on: ubuntu-latest
    steps:
      - name: Download WEP.ipa
        uses: actions/download-artifact@v4
        with:
          name: WEP-ipa
          path: release_assets

      - name: Download WEP.Host.exe
        uses: actions/download-artifact@v4
        with:
          name: WEP-Host-win-x64
          path: release_assets

      - name: Publish to GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: WEP Latest Release (iOS IPA + Windows Host)
          body: |
            - **WEP.ipa**: Unsigned/ad-hoc iOS 17+ app (install via Sideloadly / AltStore / SideStore / TrollStore).
            - **WEP.Host.exe**: Windows 10/11 gateway & Cloudflare Tunnel manager (requires .NET 9 Desktop Runtime).
          files: |
            release_assets/WEP.ipa
            release_assets/WEP.Host.exe
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

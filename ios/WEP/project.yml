name: WEP
options:
  bundleIdPrefix: com.wep.remote
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
settings:
  base:
    SWIFT_VERSION: "5.9"
    PRODUCT_NAME: WEP
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
targets:
  WEP:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WEP
    resources:
      - path: WEP/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: WEP/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.wep.remote.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
  WEPTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WEPTests
    dependencies:
      - target: WEP
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
schemes:
  WEP:
    build:
      targets:
        WEP: all
        WEPTests: [test]
    test:
      targets:
        - WEPTests
